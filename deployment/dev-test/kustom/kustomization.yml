apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev-test: real dev-test dependencies, not mocks — this cluster is meant to exercise the
# real integration path.
resources:
  - ../../base

images:
  - name: PLACEHOLDER_IMAGE
    # Confirmed by Portal26: the ECR repository name is pulse-hive-service.
    newName: 427028034291.dkr.ecr.us-east-2.amazonaws.com/pulse-hive-service
    newTag: dev-latest

patches:
  - target:
      kind: Deployment
      name: pulse-hive-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev-test
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: dev-test
      # AWS Secrets Manager loader inputs — see README "Secrets Manager" section, which
      # documents the ported loader under src/main/java/.../config/cloud/ and how to wire it
      # into your app. Two secrets, comma-separated, both CONFIRMED by Portal26 (not guesses):
      # partner-gateway-auth (shared with partner-gateway; supplies the
      # X-P26-Internal-Client-Id header value you send when calling partner-gateway) and
      # hive-service (your own config).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: titaniam.aws.region
          value: ap-south-1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: pulse.secretsmanager.properties.keyname
          value: pulse.dev-test.partner-gateway-auth.properties,pulse.dev-test.hive-service.properties
