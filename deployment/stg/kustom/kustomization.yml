apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: PLACEHOLDER_IMAGE
    # Confirmed by Portal26: the ECR repository name is pulse-hive-service.
    newName: 427028034291.dkr.ecr.us-east-2.amazonaws.com/pulse-hive-service
    newTag: stg-latest

patches:
  - target:
      kind: Deployment
      name: pulse-hive-service
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: stg
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: stg
      # AWS Secrets Manager loader inputs — see README "Secrets Manager" section. Region is
      # us-east-2 here (staging runs in the same region as its ECR account). Two secrets,
      # comma-separated, both CONFIRMED by Portal26 (not guesses): partner-gateway-auth
      # (shared with partner-gateway; supplies the X-P26-Internal-Client-Id header value) and
      # hive-service (your own config).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: titaniam.aws.region
          value: us-east-2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: pulse.secretsmanager.properties.keyname
          value: pulse.stg.partner-gateway-auth.properties,pulse.stg.hive-service.properties
