# Near-empty runtime config baked into the image. Real per-environment values come from
# environment variables (see deployment/base/deployment.yml and the per-env overlays) plus
# AWS Secrets Manager (see README "Secrets Manager"). The active Spring profile IS the
# environment (dev-test/stg/prod) — see SPRING_PROFILES_ACTIVE in deployment/base/deployment.yml.

spring.application.name=hive-service
management.server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
