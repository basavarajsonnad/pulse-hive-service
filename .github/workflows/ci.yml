name: ci

# TODO: confirm this matches your default branch. Portal26's own services trigger on a
# branch named `root`; this skeleton uses `main` — change if your repo uses something else.
#
# Flow: build & test -> build the arm64 image -> push it to BOTH the staging and production
# ECR accounts (same image, different tag prefix) -> call deploy-stg.yml, which deploys to
# staging and, on success, chains into deploy-prod.yml. This mirrors Portal26's own
# push -> stg -> prod pipeline so pulse-hive-service deploys the same way every other
# service on this platform does.
on:
  push:
    branches: [ main ]

env:
  # Confirmed by Portal26: the ECR repository name is pulse-hive-service, in both the
  # dev-test/stg account (427028034291) and the prod account (309325302342).
  ECR_REPOSITORY: pulse-hive-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # TODO: match whatever JDK distribution/version your project actually needs. The
          # runtime container (docker-arm64/Dockerfile) is pinned to Java 25 (distroless
          # java25) — if you change the Java version here, update that Dockerfile too.
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: ./gradlew --no-daemon clean build
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Slack - Failed
        uses: voxmedia/github-action-slack-notify-build@v1.6.0
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
        with:
          # Confirmed: same Slack channel pulse-partner-gateway uses for build/deploy notifications.
          channel_id: C0B3RS2S1R7
          status: FAILED
          color: danger

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build jar
        run: ./gradlew --no-daemon clean bootJar

      - name: Stage jar for docker build
        # TODO: match the jar filename Gradle actually produces (depends on your
        # build.gradle `version`). The Dockerfile expects `hive-service.jar` by default.
        run: cp build/libs/pulse-hive-service-0.0.1-SNAPSHOT.jar docker-arm64/hive-service.jar

      - name: Configure AWS credentials (stg account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STG_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR (stg account)
        id: ecr-stg
        uses: aws-actions/amazon-ecr-login@v2

      # arm64 only, matching every other service on this platform — there is no amd64 build.
      - name: Build, tag, and push arm64 image to staging ECR
        working-directory: ./docker-arm64
        env:
          ECR_REGISTRY: ${{ steps.ecr-stg.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:stg-latest" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:stg-${{ github.run_number }}" \
            --push .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.ecr-stg.outputs.registry }}/${{ env.ECR_REPOSITORY }}:stg-${{ github.run_number }}
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Configure AWS credentials (prod account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR (prod account)
        id: ecr-prod
        uses: aws-actions/amazon-ecr-login@v2

      # Prod deploys from its own account's ECR, so the same image built above is re-tagged
      # and pushed there too, ready for deploy-prod.yml to reference by tag.
      - name: Re-tag and push image to production ECR
        env:
          STG_ECR_REGISTRY: ${{ steps.ecr-stg.outputs.registry }}
          PROD_ECR_REGISTRY: ${{ steps.ecr-prod.outputs.registry }}
        run: |
          docker tag "$STG_ECR_REGISTRY/$ECR_REPOSITORY:stg-${{ github.run_number }}" "$PROD_ECR_REGISTRY/$ECR_REPOSITORY:prod-${{ github.run_number }}"
          docker tag "$STG_ECR_REGISTRY/$ECR_REPOSITORY:stg-${{ github.run_number }}" "$PROD_ECR_REGISTRY/$ECR_REPOSITORY:prod-latest"
          docker push "$PROD_ECR_REGISTRY/$ECR_REPOSITORY:prod-${{ github.run_number }}"
          docker push "$PROD_ECR_REGISTRY/$ECR_REPOSITORY:prod-latest"

      - name: Slack - Failed
        uses: voxmedia/github-action-slack-notify-build@v1.6.0
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
        with:
          channel_id: C0B3RS2S1R7
          status: FAILED
          color: danger

      - name: Slack - Success
        uses: voxmedia/github-action-slack-notify-build@v1.6.0
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
        with:
          channel_id: C0B3RS2S1R7
          status: SUCCESS
          color: good

  call-stg-deploy:
    needs: build-and-push-image
    if: success()
    uses: ./.github/workflows/deploy-stg.yml
    secrets: inherit
    with:
      version: "${{ github.run_number }}"
