org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Longer HTTP timeouts for dependency / wrapper downloads
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000
# Avoid system SOCKS proxy (caused Connect timed out to services.gradle.org via SocksSocketImpl)
systemProp.java.net.useSystemProxies=false
systemProp.socksProxyHost=
systemProp.socksProxyPort=
