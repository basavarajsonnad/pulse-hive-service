plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.portal26'
version = '0.0.1-SNAPSHOT'
description = 'Pulse Hive Service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Spring Boot does not read `.env` by itself — load it for local `./gradlew bootRun`
tasks.named('bootRun') {
	doFirst {
		def envFile = file('.env')
		if (!envFile.exists()) {
			logger.warn('No .env file found. Copy .env.example to .env or export DB_URL / DB_USERNAME / DB_PASSWORD.')
			return
		}
		envFile.eachLine { String raw ->
			def line = raw.trim()
			if (line.isEmpty() || line.startsWith('#')) {
				return
			}
			def idx = line.indexOf('=')
			if (idx <= 0) {
				return
			}
			def key = line.substring(0, idx).trim()
			def value = line.substring(idx + 1).trim()
			if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
				value = value.substring(1, value.length() - 1)
			}
			environment key, value
		}
	}
}
