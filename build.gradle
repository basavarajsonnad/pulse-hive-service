plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.portal26'
version = '0.0.1-SNAPSHOT'
description = 'Pulse Hive Service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		name = 'GitHubPackages'
		// com.titaniamlabs:engine-obf — requires GIT_USERNAME / GIT_TOKEN (read:packages)
		url = uri('https://maven.pkg.github.com/titaniamlabs/engine-obf')
		credentials {
			username = System.getenv('GIT_USERNAME') ?: (findProperty('gpr.user') ?: '')
			password = System.getenv('GIT_TOKEN') ?: (findProperty('gpr.key') ?: '')
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	// AWS SDK BOM keeps all awssdk module versions aligned — declare modules without versions.
	implementation platform('software.amazon.awssdk:bom:2.31.78')
	implementation 'software.amazon.awssdk:cognitoidentityprovider'
	implementation 'software.amazon.awssdk:secretsmanager'
	// Required by the DefaultCredentialsProvider (IRSA) path in AwsAppPropertyLoader — the
	// web-identity token exchange is implemented in the sts module.
	implementation 'software.amazon.awssdk:sts'
	implementation 'org.json:json:20240303'
	implementation 'com.titaniamlabs:engine-obf:0.0.5'
	// JSON stdout logging via LogstashEncoder (docker-arm64/logback.xml).
	implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Spring Boot does not read `.env` by itself — load it for local `./gradlew bootRun`.
// Default to the local profile so bootRun skips AWS Secrets Manager unless .env overrides it.
tasks.named('bootRun') {
	environment 'SPRING_PROFILES_ACTIVE', 'local'
	doFirst {
		def envFile = file('.env')
		if (!envFile.exists()) {
			logger.warn('No .env file found. Copy .env.example to .env (local: HIVE_DATASOURCE_*; deployed: pulse.secretsmanager.properties.keyname).')
			return
		}
		envFile.eachLine { String raw ->
			def line = raw.trim()
			if (line.isEmpty() || line.startsWith('#')) {
				return
			}
			def idx = line.indexOf('=')
			if (idx <= 0) {
				return
			}
			def key = line.substring(0, idx).trim()
			def value = line.substring(idx + 1).trim()
			if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
				value = value.substring(1, value.length() - 1)
			}
			environment key, value
		}
	}
}
