spring:
  application:
    name: pulse-hive-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: pulse-hive-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
      register-mbeans: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Mirrors Core, which rejects unrecognised fields. Jackson 3 allows them by default.
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
    enable:
      hikaricp: true
      jvm: true
      process: true
      system: true
      http: true

hive:
  cors:
    allowed-origins: ${HIVE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  msp:
    # Seeded MSP used until Cognito exists. Must match the id inserted by V3__seed_msp.sql.
    seed-id: ${HIVE_SEED_MSP_ID:00000000-0000-0000-0000-000000000001}

portal26:
  core:
    # Must already include the /partner-gateway base path.
    base-url: ${CORE_BASE_URL:http://localhost:8081}
    internal-client-id: ${CORE_INTERNAL_CLIENT_ID:}
    # Per-request HTTP timeouts for Core calls, unrelated to the provisioning poll interval.
    connect-timeout-ms: ${CORE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CORE_READ_TIMEOUT_MS:10000}
