spring:
  application:
    name: pulse-hive-service
  # Datasource is built manually in DataSourceConfig from hive.datasource.* (SM / local profile).
  # Do not use spring.datasource.* — empty placeholders here would shadow Secrets Manager.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Optional DDL override via FLYWAY_USER / FLYWAY_PASSWORD (or SPRING_FLYWAY_*).
    # When unset, Flyway uses the primary DataSource.

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # ALB/NodePort route the /hive/ path-prefix to this pod; probes hit /hive/actuator/health.
    # Overridable for local dev (set SERVER_CONTEXT_PATH=/ to drop the prefix locally).
    context-path: ${SERVER_CONTEXT_PATH:/hive}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
    enable:
      hikaricp: true
      jvm: true
      process: true
      system: true
      http: true

hive:
  # url / username / password come from AWS SM (hive.datasource.*) outside local/test.
  datasource:
    hikari:
      pool-name: pulse-hive-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
      register-mbeans: true
  cors:
    allowed-origins: ${HIVE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cognito:
    region: ${COGNITO_REGION}
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    client-secret: ${COGNITO_CLIENT_SECRET:}
    issuer-uri: ${COGNITO_ISSUER_URI}
    domain: ${COGNITO_DOMAIN}
    redirect-uri: ${COGNITO_REDIRECT_URI}
    frontend-success-url: ${COGNITO_FRONTEND_SUCCESS_URL:http://localhost:3000}
    frontend-error-url: ${COGNITO_FRONTEND_ERROR_URL:http://localhost:3000}
    logout-uri: ${COGNITO_LOGOUT_URI:http://localhost:3000}
    bootstrap-admin: ${COGNITO_BOOTSTRAP_ADMIN:false}
    bootstrap-email: ${COGNITO_BOOTSTRAP_EMAIL:admin@portal26.ai}
    bootstrap-password: ${COGNITO_BOOTSTRAP_PASSWORD:Admin@123}
    bootstrap-provider: ${COGNITO_BOOTSTRAP_PROVIDER:CinchIT}
  session:
    cookie-name: ${HIVE_SESSION_COOKIE_NAME:HIVE_SESSION}
    ttl: ${HIVE_SESSION_TTL:7d}
  provisioning:
    poll:
      enabled: ${HIVE_PROVISIONING_POLL_ENABLED:true}
      cron: ${HIVE_PROVISIONING_POLL_CRON:0/30 * * * * *}

core:
  base-url: ${CORE_BASE_URL}
  internal-client-id: ${CORE_INTERNAL_CLIENT_ID:}
  connect-timeout-ms: ${CORE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${CORE_READ_TIMEOUT_MS:10000}
