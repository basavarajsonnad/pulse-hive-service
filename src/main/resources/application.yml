spring:
  application:
    name: pulse-hive-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: pulse-hive-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
      register-mbeans: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
    enable:
      hikaricp: true
      jvm: true
      process: true
      system: true
      http: true

hive:
  cors:
    allowed-origins: ${HIVE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cognito:
    region: ${COGNITO_REGION}
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    client-secret: ${COGNITO_CLIENT_SECRET:}
    issuer-uri: ${COGNITO_ISSUER_URI}
    domain: ${COGNITO_DOMAIN}
    redirect-uri: ${COGNITO_REDIRECT_URI}
    frontend-success-url: ${COGNITO_FRONTEND_SUCCESS_URL:http://localhost:3000}
    frontend-error-url: ${COGNITO_FRONTEND_ERROR_URL:http://localhost:3000}
    logout-uri: ${COGNITO_LOGOUT_URI:http://localhost:3000}
    bootstrap-admin: ${COGNITO_BOOTSTRAP_ADMIN:false}
    bootstrap-email: ${COGNITO_BOOTSTRAP_EMAIL:admin@portal26.ai}
    bootstrap-password: ${COGNITO_BOOTSTRAP_PASSWORD:Admin@123}
  session:
    cookie-name: ${HIVE_SESSION_COOKIE_NAME:HIVE_SESSION}
    ttl: ${HIVE_SESSION_TTL:7d}
    cookie-secure: ${HIVE_SESSION_COOKIE_SECURE:false}
