spring:
  datasource:
    url: jdbc:h2:mem:pulse_hive;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisRepositoriesAutoConfiguration

hive:
  seed-msp-id: 00000000-0000-0000-0000-000000000001
  seed-msp-fallback-enabled: true
  cors:
    allowed-origins: http://localhost:3000
  cognito:
    region: ap-south-1
    user-pool-id: test-pool
    client-id: test-client
    client-secret: test-secret
    issuer-uri: https://cognito-idp.ap-south-1.amazonaws.com/test-pool
    domain: https://test.auth.ap-south-1.amazoncognito.com
    redirect-uri: http://localhost:8080/api/v1/auth/callback
    frontend-success-url: http://localhost:3000
    frontend-error-url: http://localhost:3000
    logout-uri: http://localhost:3000
    bootstrap-admin: false
    bootstrap-email: admin@portal26.ai
    bootstrap-password: Admin@123
    bootstrap-provider: CinchIT
  session:
    cookie-name: HIVE_SESSION
    ttl: 7d
    cookie-secure: false
  provisioning:
    poll:
      enabled: false

core:
  base-url: http://localhost:8081
  internal-client-id: test
  connect-timeout-ms: 100
  read-timeout-ms: 100
