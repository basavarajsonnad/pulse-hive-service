spring:
  datasource:
    url: jdbc:h2:mem:pulse_hive;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

hive:
  seed-msp-id: 00000000-0000-0000-0000-000000000001

core:
  base-url: http://localhost:8081
  internal-client-id: test
  connect-timeout-ms: 100
  read-timeout-ms: 100
